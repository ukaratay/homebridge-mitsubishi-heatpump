name: Publish to npm

on:
  release:
    types: [published]
  # Manual trigger for validating the publish path (e.g. re-running against an
  # already-published version: OIDC auth succeeds, npm then rejects the duplicate).
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for npm Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v5

      # NOTE: do NOT set registry-url / NODE_AUTH_TOKEN here. setup-node writes an
      # .npmrc that expects a token and that interferes with OIDC trusted publishing.
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      # Trusted publishing requires npm CLI >= 11.5.1 (newer than what ships with Node).
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # A release whose tag is not v<package.json version> is a forgotten version bump.
      # It has to fail here, BEFORE the idempotency step below: that step would see the
      # old version already on npm, skip, and leave the run green with nothing published.
      # workflow_dispatch carries no tag and is not checked.
      - name: Check the release tag matches package.json
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ -n "$RELEASE_TAG" ] && [ "$RELEASE_TAG" != "v$VERSION" ]; then
            echo "::error::Release tag $RELEASE_TAG does not match package.json version $VERSION (expected v$VERSION)."
            exit 1
          fi

      # Makes the job idempotent. npm rejects a duplicate version with a hard error, so
      # without this any release event for a version already on the registry goes red —
      # including backfilling a GitHub release for an older tag, which the "a release for
      # every version" convention asks for. Skipping is the honest outcome there: the
      # version is published, nothing is left to do.
      - name: Skip if this version is already published
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "homebridge-mitsubishi-heatpump@$VERSION" version >/dev/null 2>&1; then
            echo "$VERSION is already on npm; nothing to publish."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # Auth is handled automatically via OIDC because a trusted publisher is
      # configured for this package on npmjs.com (no NPM_TOKEN secret needed).
      #
      # A prerelease (any version with a hyphen, e.g. 2.4.0-beta.1) is published under
      # its own dist-tag, the word after the hyphen ("beta"), and never under "latest":
      # `npm install homebridge-mitsubishi-heatpump` keeps resolving to the last full
      # release, and a beta is installed on purpose with `...@beta`. npm 11 also refuses
      # to publish a prerelease without an explicit --tag, so without this a beta release
      # would simply fail. Ported from homebridge-mitsubishi-comfort 2c3d67d.
      - name: Publish to npm
        if: steps.check.outputs.published == 'false'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          case "$VERSION" in
            *-*)
              PRE="${VERSION#*-}"
              DIST_TAG="${PRE%%.*}"
              # Lower-case letters only, and never "latest": a prerelease must not be
              # able to take over the tag that plain installs resolve.
              case "$DIST_TAG" in
                ''|latest|*[!a-z]*)
                  echo "::error::Cannot derive a dist-tag from version $VERSION (got '$DIST_TAG'). Use the form 1.2.3-beta.1."
                  exit 1
                  ;;
              esac
              ;;
            *)
              DIST_TAG=latest
              ;;
          esac
          echo "Publishing $VERSION under the '$DIST_TAG' dist-tag."
          npm publish --provenance --access public --tag "$DIST_TAG"
